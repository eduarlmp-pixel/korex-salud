{% extends "base.html" %}{% set active_page = "sistemas" %}
{% block title %}Nuevo Equipo — Sistemas{% endblock %}{% block page_title %}Nuevo Equipo de Cómputo{% endblock %}
{% block content %}
<div class="page-header"><div><h1>Registrar equipo</h1></div><a href="/sistemas" class="btn btn-secondary">← Volver</a></div>
<div style="max-width:640px;"><div class="card"><form action="/sistemas/nuevo-equipo" method="post">
  <div class="form-group"><label class="form-label">Nombre / Identificación *</label><input type="text" name="nombre" class="form-control" required placeholder="PC-URG-01, Laptop Dirección…"></div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Tipo</label><select name="tipo" class="form-control"><option value="desktop">Desktop</option><option value="laptop">Laptop</option><option value="servidor">Servidor</option><option value="impresora">Impresora</option><option value="otro">Otro</option></select></div>
    <div class="form-group"><label class="form-label">Área</label><input type="text" name="area" class="form-control"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Marca</label><input type="text" name="marca" class="form-control"></div>
    <div class="form-group"><label class="form-label">Modelo</label><input type="text" name="modelo" class="form-control"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">N° Serie</label><input type="text" name="serie" class="form-control"></div>
    <div class="form-group"><label class="form-label">IP</label><input type="text" name="ip" class="form-control" placeholder="192.168.1.x"></div>
  </div>
  <div class="form-row">
    <div class="form-group"><label class="form-label">Sistema operativo</label><input type="text" name="so" class="form-control" placeholder="Windows 11, Ubuntu…"></div>
    <div class="form-group"><label class="form-label">Usuario asignado</label><input type="text" name="usuario_asignado" class="form-control"></div>
  </div>
  <div class="divider"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;"><a href="/sistemas" class="btn btn-secondary">Cancelar</a><button type="submit" class="btn btn-primary">💻 Registrar</button></div>
</form></div></div>
{% endblock %}
