{% extends "base.html" %}
{% set active_page = "indicadores" %}
{% block title %}Nuevo Indicador — QMS Salud{% endblock %}
{% block page_title %}Nuevo Indicador{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>Nuevo indicador</h1><div class="subtitle">Ficha técnica del indicador de calidad</div></div>
  <a href="/indicadores" class="btn btn-secondary">← Volver</a>
</div>
<div style="max-width:760px;">
  <div class="card">
    <form action="/indicadores/nuevo" method="post">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Código *</label>
          <input type="text" name="codigo" class="form-control" placeholder="IND-001" required>
        </div>
        <div class="form-group">
          <label class="form-label">Proceso</label>
          <input type="text" name="proceso" class="form-control" placeholder="UCI, Hospitalización, Calidad…">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Nombre del indicador *</label>
        <input type="text" name="nombre" class="form-control" placeholder="Ej: Tasa de infección asociada a atención en salud" required>
      </div>
      <div class="form-group">
        <label class="form-label">Fórmula de cálculo</label>
        <input type="text" name="formula" class="form-control" placeholder="(N° infecciones / N° egresos) × 100">
      </div>
      <div class="form-row-3">
        <div class="form-group">
          <label class="form-label">Unidad de medida</label>
          <input type="text" name="unidad" class="form-control" placeholder="%, días, por 1000…">
        </div>
        <div class="form-group">
          <label class="form-label">Frecuencia de medición</label>
          <select name="frecuencia" class="form-control">
            <option value="mensual">Mensual</option>
            <option value="trimestral">Trimestral</option>
            <option value="semestral">Semestral</option>
            <option value="anual">Anual</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Meta</label>
          <input type="number" step="0.01" name="meta" class="form-control" placeholder="0">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Límite mínimo aceptable</label>
          <input type="number" step="0.01" name="meta_minima" class="form-control" placeholder="0">
        </div>
        <div class="form-group">
          <label class="form-label">Límite máximo aceptable</label>
          <input type="number" step="0.01" name="meta_maxima" class="form-control" placeholder="100">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Responsable *</label>
        <select name="responsable_id" class="form-control" required>
          <option value="">Seleccionar…</option>
          {% for u in usuarios %}
          <option value="{{ u.id }}">{{ u.nombre }} {{ u.apellido }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="divider"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <a href="/indicadores" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">+ Crear indicador</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
