<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión — KOREX SOLUTIONS SAS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body, html {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: linear-gradient(135deg, #dce8f5 0%, #edf1f8 40%, #dee2f5 100%);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        padding: 24px;
        box-sizing: border-box;
        animation: fadeIn 0.5s ease-out;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @keyframes float {
        0% { transform: translateY(0px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08); }
        50% { transform: translateY(-10px); box-shadow: 0 24px 48px rgba(0, 0, 0, 0.12); }
        100% { transform: translateY(0px); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08); }
    }

    .logo-card {
        background: white;
        border-radius: 32px;
        padding: 24px;
        width: 140px;
        height: 140px;
        margin: 0 auto 28px auto;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.08);
        display: flex;
        justify-content: center;
        align-items: center;
        animation: float 4s ease-in-out infinite;
    }

    .logo-card img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
    }

    .title {
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        color: #1e293b;
        margin: 0 0 10px 0;
        letter-spacing: -0.5px;
    }

    .subtitle {
        text-align: center;
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
        margin: 0 0 44px 0;
        text-transform: uppercase;
        letter-spacing: 0.8px;
    }

    .form-group {
        margin-bottom: 24px;
    }

    .form-label {
        display: block;
        font-size: 15px;
        font-weight: 600;
        color: #475569;
        margin-bottom: 10px;
        margin-left: 4px;
    }

    .form-control {
        width: 100%;
        padding: 16px 20px;
        font-size: 15px;
        font-weight: 500;
        border: 2px solid transparent;
        border-radius: 14px;
        background: white;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
        box-sizing: border-box;
        transition: all 0.25s ease;
        color: #1e293b;
    }

    .form-control:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 8px 20px rgba(59, 130, 246, 0.15);
        transform: translateY(-1px);
    }

    .form-control::placeholder {
        color: #94a3b8;
        font-weight: 400;
    }

    .btn-primary {
        display: block;
        width: 100%;
        padding: 16px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 14px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 8px 24px rgba(37, 99, 235, 0.3);
        transition: all 0.25s ease;
        margin-top: 36px;
        letter-spacing: 0.3px;
    }

    .btn-primary:hover {
        background: #1d4ed8;
        box-shadow: 0 12px 28px rgba(37, 99, 235, 0.4);
        transform: translateY(-2px);
    }
    
    .btn-primary:active {
        transform: translateY(0);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
    }

    .footer-text {
        text-align: center;
        margin-top: 28px;
        font-size: 13px;
        color: #64748b;
        font-weight: 500;
    }

    .alert {
        padding: 14px 20px;
        border-radius: 14px;
        margin-bottom: 28px;
        font-size: 14px;
        text-align: center;
        font-weight: 500;
        animation: fadeIn 0.3s ease-out;
    }

    .alert-danger {
        background: #fee2e2;
        color: #b91c1c;
        border: 1px solid #fecaca;
        box-shadow: 0 4px 12px rgba(220, 38, 38, 0.1);
    }

    /* Estilos para demo (opcional pero útil) */
    .demo-users {
        margin-top: 48px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.4);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(10px);
    }
    .demo-users-title {
        font-size: 11px;
        color: #64748b;
        font-weight: 700;
        margin-bottom: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        text-align: center;
    }
    .demo-user-item {
        font-size: 13px;
        color: #475569;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        margin-bottom: 8px;
        font-weight: 500;
    }
    .demo-user-item:last-child { margin-bottom: 0; }
    .badge {
        padding: 3px 8px;
        border-radius: 6px;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }
    .badge-blue { background: #dbeafe; color: #1e40af; }
    .badge-green { background: #dcfce7; color: #166534; }
    .badge-purple { background: #f3e8ff; color: #6b21a8; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="logo-card">
      <img src="/static/img/logo.png" alt="Korex Solutions Logo">
    </div>
    
    <h1 class="title">KOREX SOLUTIONS SAS</h1>
    <h2 class="subtitle">SISTEMAS UNIDOS DE SALUD</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form action="/auth/login" method="post">
      <div class="form-group">
        <label class="form-label">Usuario</label>
        <input type="email" name="email" class="form-control" placeholder="Nombre de usuario" required autofocus>
      </div>
      <div class="form-group">
        <label class="form-label">Contraseña</label>
        <input type="password" name="password" class="form-control" placeholder="Contraseña" required>
      </div>
      <button type="submit" class="btn-primary">
        Ingresar al sistema
      </button>
    </form>

    <div class="footer-text">
      ¿Problemas para ingresar? Contacte al soporte técnico.
    </div>

    <div class="demo-users">
      <div class="demo-users-title">Usuarios de demo</div>
      <div class="demo-user-item"><span class="badge badge-blue">admin</span> admin@qms.co / admin123</div>
      <div class="demo-user-item"><span class="badge badge-green">calidad</span> calidad@qms.co / calidad123</div>
      <div class="demo-user-item"><span class="badge badge-purple">auditor</span> auditor@qms.co / auditor123</div>
    </div>
  </div>
</body>
</html>
