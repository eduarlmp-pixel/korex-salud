{% extends "base.html" %}
{% set active_page = "pqrs" %}
{% block title %}Nueva PQRS — QMS Salud{% endblock %}
{% block page_title %}Nueva PQRS{% endblock %}

{% block content %}
<div class="page-header">
  <div><h1>Registrar PQRS</h1><div class="subtitle">Petición, queja, reclamo, sugerencia o evento adverso</div></div>
  <a href="/pqrs" class="btn btn-secondary">← Volver</a>
</div>
<div style="max-width:760px;">
  <div class="card">
    <form action="/pqrs/nueva" method="post">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Código *</label>
          <input type="text" name="codigo" class="form-control" placeholder="PQR-001" required>
        </div>
        <div class="form-group">
          <label class="form-label">Tipo *</label>
          <select name="tipo" class="form-control" required>
            <option value="peticion">Petición</option>
            <option value="queja">Queja</option>
            <option value="reclamo">Reclamo</option>
            <option value="sugerencia">Sugerencia</option>
            <option value="evento_adverso">Evento adverso</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nombre del solicitante</label>
          <input type="text" name="nombre_solicitante" class="form-control" placeholder="Nombre completo">
        </div>
        <div class="form-group">
          <label class="form-label">Email del solicitante</label>
          <input type="email" name="email_solicitante" class="form-control" placeholder="email@ejemplo.com">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Teléfono</label>
          <input type="text" name="telefono_solicitante" class="form-control" placeholder="+57 300 000 0000">
        </div>
        <div class="form-group">
          <label class="form-label">Servicio relacionado</label>
          <input type="text" name="servicio" class="form-control" placeholder="Urgencias, Consulta externa…">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Descripción *</label>
        <textarea name="descripcion" class="form-control" rows="4" required placeholder="Describa detalladamente la situación reportada…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Prioridad</label>
          <select name="prioridad" class="form-control">
            <option value="baja">Baja (20 días)</option>
            <option value="normal" selected>Normal (10 días)</option>
            <option value="alta">Alta (3 días)</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Asignado a</label>
          <select name="asignado_a" class="form-control">
            <option value="">Sin asignar</option>
            {% for u in usuarios %}
            <option value="{{ u.id }}">{{ u.nombre }} {{ u.apellido }}</option>
            {% endfor %}
          </select>
        </div>
      </div>
      <div class="divider"></div>
      <div style="display:flex; gap:8px; justify-content:flex-end;">
        <a href="/pqrs" class="btn btn-secondary">Cancelar</a>
        <button type="submit" class="btn btn-primary">+ Registrar PQRS</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
