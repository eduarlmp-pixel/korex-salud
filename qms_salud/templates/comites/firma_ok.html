<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Firma registrada — QMS Salud</title>
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body>
<div style="min-height:100vh;background:var(--bg2);display:flex;align-items:center;justify-content:center;padding:20px;">
  <div style="background:#fff;border-radius:12px;box-shadow:0 4px 24px rgba(0,0,0,0.1);max-width:440px;width:100%;text-align:center;padding:40px 32px;">
    <div style="font-size:56px;margin-bottom:12px;">✅</div>
    <h2 style="margin:0 0 10px;color:var(--text1);">¡Firma registrada!</h2>
    <p style="color:var(--text2);font-size:14px;line-height:1.6;">
      Gracias, <strong>{{ nombre }}</strong>.<br>
      Tu firma ha quedado registrada exitosamente en el sistema QMS Salud.
    </p>
    <div style="margin-top:28px;padding-top:20px;border-top:1px solid var(--border);">
      <p style="margin:0;font-size:11px;color:var(--text3);">Desarrollado por <strong>Korex Solutions SAS</strong> · QMS Salud</p>
    </div>
  </div>
</div>
</body>
</html>
